# Server
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/sacco_db
spring.datasource.username=postgres
spring.datasource.password=dev
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT
app.jwt.secret=${JWT_SECRET:ZLkHTkCJy9oytpX/v19mgKrjIlA2lOXOPZ62jRgV54qAm1YiRzBQu6UvPTa/X9YMgmax9e2oeu69ZQxCbstyWg==}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Seed data (Kenya demo Sacco, admin, sample members)
app.seed.enabled=${SEED_DATA:true}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@254}
app.seed.member-password=${SEED_MEMBER_PASSWORD:Member@254}

# Mail (SMTP, Brevo) — leave MAIL_USERNAME/MAIL_PASSWORD unset to disable sending
# without breaking registration; EmailService logs and swallows send failures either way.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@smoothsurfsacco.co.ke}
app.mail.from-name=SmoothSurf Sacco

# Spring Boot Admin Server (unrelated, pre-existing dependency) auto-activates a mail
# notifier once a JavaMailSender bean exists; it needs an InstanceRepository we never
# set up (no Admin Server persistence layer configured), so the whole notifier
# autoconfiguration is excluded rather than left to fail context startup.
spring.autoconfigure.exclude=de.codecentric.boot.admin.server.config.AdminServerNotifierAutoConfiguration

# OTP
app.otp.length=6
app.otp.expiration-minutes=10

# Frontend base URL (used when building activation links in invitation emails)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# File uploads (profile photos)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB