<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your SmoothSurf Sacco verification code</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                    <tr>
                        <td style="background-color:#ea580c; padding:24px; text-align:center;">
                            <img src="cid:logo" alt="SmoothSurf Sacco" width="160" style="display:inline-block;"/>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <h1 style="font-size:20px; color:#18181b; margin:0 0 16px;">Hi <span th:text="${recipientName}">there</span>,</h1>
                            <p style="font-size:14px; color:#3f3f46; line-height:1.6; margin:0 0 24px;">
                                Use the code below to verify your email address. It expires in
                                <span th:text="${expiryMinutes}">10</span> minutes.
                            </p>
                            <p style="font-size:32px; font-weight:bold; letter-spacing:6px; color:#ea580c; text-align:center; margin:0 0 24px;" th:text="${otp}">
                                123456
                            </p>
                            <p style="font-size:12px; color:#a1a1aa; margin:0;">
                                If you did not request this code, you can safely ignore this email.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 32px; background-color:#fafafa; text-align:center;">
                            <p style="font-size:12px; color:#a1a1aa; margin:0;" th:text="'© ' + ${copyrightYear} + ' ' + ${senderName}">
                                © 2026 SmoothSurf Sacco
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
